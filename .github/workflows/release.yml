name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for info only'
        required: false
      dry_run:
        description: 'Dry run only (no publish)'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_DIR: dist

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write            # for GitHub Release creation
      id-token: write            # required for `npm publish --provenance`
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # ---------- Canonical environment: Node 24 + pnpm ----------

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0

      - name: Setup Node 26
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "26.5.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack / pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
          pnpm -v

      - name: Install deps (deterministic)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cleanup
        run: pnpm run clean

      - name: Build Test
        run: pnpm run build

      - name: Test (Release build)
        run: pnpm run test:unit

      - name: Clean build
        run: pnpm run clean

      - name: Build Release
        run: pnpm run build

      - name: Pack & publish with provenance
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          OUT=$(npm pack --json)
          TARBALL=$(node -e "console.log(JSON.parse(process.argv[1])[0].filename)" "$OUT")
          echo "Tarball: $TARBALL"
          # publish the exact tarball only if not dry run
          if [ "${DRY_RUN}" != "true" ] && [ "${GITHUB_EVENT_NAME}" == "push" ]; then
            npm publish "$TARBALL" --provenance --access public
          else
            echo "Skipping publish (dry_run=${DRY_RUN})"
          fi
